name: Bug report
description: Report a reproducible Agent Manager problem
title: "[Bug]: "
labels:
  - "type:bug"
  - "status:needs-triage"
body:
  - type: input
    id: nvim-version
    attributes:
      label: Neovim version
      placeholder: NVIM v0.12.4
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Agent Manager revision
      description: Commit SHA or release tag.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Broker mode
      options:
        - Embedded
        - Durable
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Codex
        - Claude
        - Both
        - No provider was started
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest case without prompts, tool payloads, credentials, or private paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized diagnostics
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reproduced this on the current bluff branch or latest release.
          required: true
        - label: I removed prompts, tool payloads, credentials, and private paths.
          required: true
