[tools]
python = "3.13.15"
rust = { version = "1.98.0", profile = "minimal", components = "clippy,rustfmt" }
shellcheck = "0.11.0"
uv = "0.12.7"
neovim = "0.12.4"

[tasks.setup]
description = "Install the locked Python worker environment"
dir = "python"
run = "uv sync --frozen --all-groups"

[tasks.fmt]
description = "Check Rust and Python formatting"
depends = ["setup"]
run = [
  "cargo fmt --all -- --check",
  "cd python && uv run ruff format --check .",
]

[tasks.lint]
description = "Run Rust and Python static checks"
depends = ["setup"]
run = [
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "cd python && uv run ruff check .",
  "cd python && uv run pyright src tests",
]

[tasks.test]
description = "Run Rust, Python, Lua, and cross-language contract tests"
depends = ["setup"]
run = [
  "cargo test --workspace --all-features",
  "cd python && uv run python -m unittest discover -s tests -v",
  "cd python && uv run python ../scripts/validate_protocol.py",
  "scripts/test-lua.sh",
]

[tasks.verify]
description = "Run the complete M2 handoff gate"
run = "scripts/verify.sh"

[tasks."codex-schema"]
description = "Regenerate the pinned Codex App Server schema bundle"
run = "scripts/update-codex-schema.sh"
